services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticolisto
      POSTGRES_USER: ticolisto
      POSTGRES_PASSWORD: ticolisto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://ticolisto:ticolisto@db:5432/ticolisto
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
